aid: emerson-electric
name: Emerson Electric
description: >-
  Emerson Electric is a Fortune 500 global automation leader with more than 135
  years of innovation history. Its portfolio spans automation systems, discrete
  automation, final control, measurement instrumentation, and test and
  measurement, marketed through brands such as Fisher, Rosemount, DeltaV, Micro
  Motion, ASCO, Bettis, PACSystems, Flexim, and NI. Emerson serves industries
  including power, oil and gas, chemical, life sciences, food and beverage,
  automotive, data centers, mining, and marine. This repository captures the
  public APIs, developer resources, and machine-readable artifacts associated
  with Emerson Electric.
